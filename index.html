<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blockspiel</title>
<meta name="description" content="Setze Blöcke auf das 8×8-Feld. Volle Reihen und Spalten verschwinden.">
<meta name="theme-color" content="#1d2b64">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d2b64; --board:#111a42; --empty:#1a2558;
    --text:#fff; --muted:#9fb0e8; --gold:#ffd23f; --danger:#ff4d5e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}

  .app{--bw:min(92vw,440px,calc(100vh - 280px));
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:12px;touch-action:none}
  @supports (height:100svh){.app{--bw:min(92vw,440px,calc(100svh - 280px))}}

  /* Kopfzeile */
  .top{width:var(--bw);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .best{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:600;font-size:18px}
  .score{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:center;
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .score.bump{animation:bump .28s ease-out}
  @keyframes bump{50%{transform:scale(1.15)}}
  .actions{display:flex;justify-content:flex-end;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);
    color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;font-family:inherit}
  .icon-btn:hover{background:rgba(255,255,255,.18)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* Spielfeld */
  .wrap{position:relative;width:var(--bw);height:var(--bw)}
  .board{position:relative;width:100%;height:100%;display:grid;
    grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;padding:6px;
    background:var(--board);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:none}
  .cell{border-radius:5px;background:var(--empty);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
  .b{background:var(--c);border-radius:5px;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.38),inset 0 -4px 0 rgba(0,0,0,.25),
               inset 3px 0 0 rgba(255,255,255,.12),inset -3px 0 0 rgba(0,0,0,.12)}
  .cell.ghost{opacity:.5}
  .cell.hl{animation:glow .5s ease-in-out infinite alternate}
  @keyframes glow{from{filter:brightness(1.05)}to{filter:brightness(1.35)}}
  .cell.bad{background:rgba(255,77,94,.4)}
  .cell.b.bad{background:var(--c);outline:3px solid var(--danger);outline-offset:-3px}
  .cell.pop{animation:pop .25s ease-out}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

  .fx{position:absolute;inset:0;pointer-events:none}
  .shard{position:absolute;animation:shard .45s ease-in forwards}
  @keyframes shard{0%{transform:scale(1);opacity:1;filter:brightness(1.7)}
                   100%{transform:scale(0) rotate(30deg);opacity:0}}
  .float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;
    white-space:nowrap;animation:float 1.1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .float .pts{font-size:42px;font-weight:700}
  .float .msg{font-size:22px;color:var(--gold);font-weight:600}
  @keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}
                   20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
                   100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

  /* Ablage mit den drei Teilen */
  .tray{width:var(--bw);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;touch-action:none}
  .slot{height:calc(var(--m,22px) * 5 + 8px + 16px);border:0;background:transparent;border-radius:14px;
    display:grid;place-items:center;cursor:grab;touch-action:none;font-family:inherit;color:inherit}
  .slot:disabled{cursor:default}
  .slot.selected{background:rgba(255,255,255,.12)}
  .slot.nofit .piece{opacity:.3;filter:grayscale(.7)}
  .slot.dragging .piece{opacity:0}
  .piece{display:grid;gap:2px}
  .slot .b{border-radius:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.38),inset 0 -3px 0 rgba(0,0,0,.25)}
  .drag-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}

  .hint{color:var(--muted);font-size:14px;text-align:center;max-width:var(--bw)}

  /* Spielende */
  .overlay{position:fixed;inset:0;background:rgba(10,15,40,.78);display:grid;place-items:center;
    z-index:100;animation:fade .3s ease-out}
  @keyframes fade{from{opacity:0}}
  .card{background:#24357a;border-radius:22px;padding:28px 30px;text-align:center;width:min(86vw,340px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);animation:rise .35s ease-out}
  @keyframes rise{from{transform:translateY(20px) scale(.95)}}
  .card h2{font-size:26px;margin-bottom:14px}
  .label{color:var(--muted);font-size:16px}
  .final{font-size:56px;font-weight:700;line-height:1.1}
  .newbest{color:var(--gold);font-weight:600;font-size:20px;margin:6px 0}
  .btn{margin-top:20px;background:var(--gold);color:#1d2b64;border:0;border-radius:14px;padding:14px 24px;
    font:inherit;font-weight:700;font-size:18px;cursor:pointer;width:100%}
  .btn:hover{filter:brightness(1.07)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="best" title="Rekord"><span aria-hidden="true">👑</span><span id="best">0</span><span class="sr"> Rekord</span></div>
    <div class="score" id="score" aria-label="Punkte">0</div>
    <div class="actions">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Ton ausschalten">🔊</button>
      <button class="icon-btn" id="restartBtn" type="button" aria-label="Neues Spiel">↻</button>
    </div>
  </header>

  <div class="wrap" id="wrap">
    <div class="board" id="board" tabindex="0" aria-label="Spielfeld, 8 mal 8 Felder"></div>
    <div class="fx" id="fx"></div>
  </div>

  <div class="tray" id="tray">
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
    <button class="slot" type="button"></button>
  </div>

  <p class="hint">Ziehe die Teile aufs Feld. Volle Reihen und Spalten verschwinden.</p>
  <div class="sr" id="live" aria-live="polite"></div>
</main>

<div class="overlay" id="over" hidden role="dialog" aria-modal="true" aria-labelledby="overTitle">
  <div class="card">
    <h2 id="overTitle">Keine Züge mehr!</h2>
    <p class="label">Punkte</p>
    <p class="final" id="final">0</p>
    <p class="newbest" id="newBest" hidden>🎉 Neuer Rekord!</p>
    <p class="label">Rekord: <span id="finalBest">0</span></p>
    <button class="btn" id="again" type="button">Nochmal spielen</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const N = 8;
  const COLORS = ['#ff4d5e', '#ff9f1c', '#ffd23f', '#3ddc84', '#2ec4f1', '#4f6bff', '#b05cff'];

  // Formen: X = Block, . = leer
  const SHAPES = [
    ['X'], ['XX'], ['X','X'], ['XXX'], ['X','X','X'], ['XXXX'], ['X','X','X','X'], ['XXXXX'], ['X','X','X','X','X'],
    ['XX','XX'], ['XXX','XXX','XXX'], ['XXX','XXX'], ['XX','XX','XX'],
    ['XX','X.'], ['XX','.X'], ['X.','XX'], ['.X','XX'],
    ['XXX','X..','X..'], ['XXX','..X','..X'], ['X..','X..','XXX'], ['..X','..X','XXX'],
    ['X.','X.','XX'], ['.X','.X','XX'], ['XX','X.','X.'], ['XX','.X','.X'],
    ['XXX','X..'], ['XXX','..X'], ['X..','XXX'], ['..X','XXX'],
    ['XXX','.X.'], ['.X.','XXX'], ['X.','XX','X.'], ['.X','XX','.X'],
    ['XX.','.XX'], ['.XX','XX.'], ['X.','XX','.X'], ['.X','XX','X.']
  ].map(rows => {
    const cells = [];
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'X') cells.push([y, x]); }));
    return { cells, h: rows.length, w: Math.max(...rows.map(r => r.length)) };
  });

  // DOM
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), fxEl = $('fx'), trayEl = $('tray'), liveEl = $('live');
  const scoreEl = $('score'), bestEl = $('best');
  const overEl = $('over'), finalEl = $('final'), finalBestEl = $('finalBest'), newBestEl = $('newBest');
  const soundBtn = $('soundBtn');
  const slotEls = [...trayEl.querySelectorAll('.slot')];
  const cellEls = [];
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cellEls.push(d);
  }

  // Speicher (falls verfügbar)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // Zustand
  let grid, tray, score, combo, sinceClear, over, startBest;
  let best = +store.get('blockspiel-best', 0) || 0;
  let soundOn = store.get('blockspiel-sound', '1') === '1';
  let preview = null, drag = null, kb = null;
  const popping = new Set();

  // Ton
  let actx = null;
  function tone(freq, dur = 0.09, type = 'sine', vol = 0.07, delay = 0) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function updateSoundBtn() {
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-label', soundOn ? 'Ton ausschalten' : 'Ton einschalten');
  }

  // Logik
  const rnd = n => Math.floor(Math.random() * n);
  const fmt = n => n.toLocaleString('de-DE');
  const randPiece = () => ({ shape: SHAPES[rnd(SHAPES.length)], color: rnd(COLORS.length) + 1 });

  function canPlace(shape, r, c) {
    for (const [y, x] of shape.cells) {
      const rr = r + y, cc = c + x;
      if (rr < 0 || cc < 0 || rr >= N || cc >= N || grid[rr][cc]) return false;
    }
    return true;
  }
  function fits(shape) {
    for (let r = 0; r <= N - shape.h; r++)
      for (let c = 0; c <= N - shape.w; c++)
        if (canPlace(shape, r, c)) return true;
    return false;
  }
  function newTray() {
    let t;
    for (let k = 0; k < 30; k++) {
      t = [randPiece(), randPiece(), randPiece()];
      if (t.some(p => fits(p.shape))) break;
    }
    tray = t;
  }
  function fullLines(g) {
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      if (g[i].every(v => v)) rows.push(i);
      if (g.every(row => row[i])) cols.push(i);
    }
    return { rows, cols };
  }

  function setPreview(slot, r, c) {
    const p = tray[slot];
    if (!p) { preview = null; return; }
    const valid = canPlace(p.shape, r, c);
    const cells = new Set(), lines = new Set();
    p.shape.cells.forEach(([y, x]) => {
      const rr = r + y, cc = c + x;
      if (rr >= 0 && cc >= 0 && rr < N && cc < N) cells.add(rr * N + cc);
    });
    if (valid) {
      const tmp = grid.map(row => row.slice());
      p.shape.cells.forEach(([y, x]) => { tmp[r + y][c + x] = 1; });
      const { rows, cols } = fullLines(tmp);
      rows.forEach(rr => { for (let j = 0; j < N; j++) lines.add(rr * N + j); });
      cols.forEach(cc => { for (let j = 0; j < N; j++) lines.add(j * N + cc); });
    }
    preview = { cells, lines, color: COLORS[p.color - 1], valid };
  }

  // Darstellung
  function render() {
    for (let i = 0; i < N * N; i++) {
      const v = grid[(i / N) | 0][i % N], el = cellEls[i];
      let cls = 'cell', col = '';
      if (v) { cls = 'cell b'; col = COLORS[v - 1]; }
      if (preview) {
        if (preview.cells.has(i)) {
          if (preview.valid) { cls = preview.lines.has(i) ? 'cell b hl' : 'cell b ghost'; col = preview.color; }
          else cls += ' bad';
        } else if (preview.lines.has(i) && v) { cls += ' hl'; col = preview.color; }
      }
      if (popping.has(i)) cls += ' pop';
      if (el.className !== cls) el.className = cls;
      if (el.style.getPropertyValue('--c') !== col) el.style.setProperty('--c', col);
    }
  }
  function geom() {
    const a = cellEls[0].getBoundingClientRect(), b = cellEls[1].getBoundingClientRect();
    return { x: a.left, y: a.top, size: a.width, pitch: b.left - a.left };
  }
  function buildPiece(p, size, gap) {
    const g = document.createElement('div');
    g.className = 'piece';
    g.style.gridTemplateColumns = `repeat(${p.shape.w}, ${size})`;
    g.style.gridTemplateRows = `repeat(${p.shape.h}, ${size})`;
    if (gap) g.style.gap = gap;
    p.shape.cells.forEach(([y, x]) => {
      const b = document.createElement('div');
      b.className = 'b';
      b.style.gridRow = y + 1; b.style.gridColumn = x + 1;
      b.style.setProperty('--c', COLORS[p.color - 1]);
      g.appendChild(b);
    });
    return g;
  }
  function renderTray() {
    const mini = Math.max(10, Math.floor(geom().size * 0.46));
    trayEl.style.setProperty('--m', mini + 'px');
    slotEls.forEach((el, i) => {
      const p = tray[i];
      el.innerHTML = '';
      el.classList.remove('dragging');
      if (!p) {
        el.disabled = true; el.classList.remove('nofit', 'selected');
        el.setAttribute('aria-label', `Platz ${i + 1}: leer`);
        return;
      }
      el.disabled = false;
      el.appendChild(buildPiece(p, 'var(--m)'));
      const ok = fits(p.shape);
      el.classList.toggle('nofit', !ok);
      el.setAttribute('aria-label',
        `Teil ${i + 1}: ${p.shape.cells.length} Blöcke, ${p.shape.w} breit, ${p.shape.h} hoch${ok ? '' : ', passt nirgends'}`);
    });
  }
  function updateScore(bump) {
    scoreEl.textContent = fmt(score);
    bestEl.textContent = fmt(best);
    if (bump) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
  }
  const announce = t => { liveEl.textContent = t; };

  function burst(cleared) {
    cleared.forEach((v, idx) => {
      const cell = cellEls[idx];
      const s = document.createElement('div');
      s.className = 'shard b';
      s.style.setProperty('--c', COLORS[v - 1]);
      s.style.left = boardEl.offsetLeft + cell.offsetLeft + 'px';
      s.style.top = boardEl.offsetTop + cell.offsetTop + 'px';
      s.style.width = cell.offsetWidth + 'px';
      s.style.height = cell.offsetHeight + 'px';
      s.style.animationDelay = ((idx % N) + ((idx / N) | 0)) * 14 + 'ms';
      fxEl.appendChild(s);
      setTimeout(() => s.remove(), 800);
    });
  }
  function floatText(main, sub) {
    const f = document.createElement('div');
    f.className = 'float';
    f.innerHTML = `<div class="pts">${main}</div>${sub ? `<div class="msg">${sub}</div>` : ''}`;
    fxEl.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  // Teil setzen
  function place(slot, r, c) {
    const p = tray[slot];
    if (!p || !canPlace(p.shape, r, c)) return false;
    popping.clear();
    p.shape.cells.forEach(([y, x]) => { grid[r + y][c + x] = p.color; popping.add((r + y) * N + c + x); });
    tray[slot] = null;

    let gained = p.shape.cells.length;
    const { rows, cols } = fullLines(grid);
    const lines = rows.length + cols.length;

    if (lines) {
      combo++; sinceClear = 0;
      const cleared = new Map();
      rows.forEach(rr => { for (let j = 0; j < N; j++) cleared.set(rr * N + j, grid[rr][j]); });
      cols.forEach(cc => { for (let j = 0; j < N; j++) cleared.set(j * N + cc, grid[j][cc]); });
      cleared.forEach((v, idx) => { grid[(idx / N) | 0][idx % N] = 0; popping.delete(idx); });
      gained += lines * lines * 10 * combo;

      let msg = lines > 1 ? `${lines} Reihen!` : '';
      if (combo > 1) msg = `Combo x${combo}` + (msg ? ' · ' + msg : '');
      if (grid.every(row => row.every(v => !v))) { gained += 300; msg = 'Alles leer! +300'; }

      burst(cleared);
      floatText('+' + fmt(gained), msg);
      [523, 659, 784, 1047].slice(0, Math.min(4, lines + 1))
        .forEach((f, k) => tone(f * (1 + Math.min(combo - 1, 6) * 0.06), 0.14, 'triangle', 0.08, k * 0.06));
      if (navigator.vibrate) navigator.vibrate(25);
      announce(`${lines} ${lines > 1 ? 'Reihen' : 'Reihe'} entfernt. Plus ${gained} Punkte.`);
    } else {
      sinceClear++;
      if (sinceClear >= 3) combo = 0;
      tone(200, 0.07, 'triangle', 0.09);
    }

    score += gained;
    if (score > best) { best = score; store.set('blockspiel-best', best); }
    updateScore(true);

    if (tray.every(t => !t)) newTray();
    render();
    renderTray();
    setTimeout(() => { popping.clear(); render(); }, 260);

    if (!tray.some(t => t && fits(t.shape))) gameOver();
    return true;
  }

  function gameOver() {
    over = true;
    cancelKb();
    tone(196, 0.25, 'sawtooth', 0.05); tone(147, 0.4, 'sawtooth', 0.05, 0.2);
    setTimeout(() => {
      finalEl.textContent = fmt(score);
      finalBestEl.textContent = fmt(best);
      newBestEl.hidden = !(score > startBest && score > 0);
      overEl.hidden = false;
      $('again').focus();
      announce(`Spiel vorbei. ${score} Punkte.`);
    }, 700);
  }

  function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(0));
    score = 0; combo = 0; sinceClear = 0; over = false; startBest = best;
    preview = null; kb = null; popping.clear();
    fxEl.innerHTML = '';
    overEl.hidden = true;
    newTray();
    render(); renderTray(); updateScore(false);
  }

  // Ziehen mit Maus / Finger
  function startDrag(i, e) {
    cancelKb();
    const p = tray[i], g = geom(), gap = g.pitch - g.size;
    const ghost = buildPiece(p, g.size + 'px', gap + 'px');
    ghost.classList.add('drag-ghost');
    document.body.appendChild(ghost);
    const w = p.shape.w * g.pitch - gap, h = p.shape.h * g.pitch - gap;
    const lift = e.pointerType === 'mouse' ? h / 2 : h + g.size * 0.9;
    drag = { slot: i, ghost, g, w, h, lift, r: null, c: null, id: e.pointerId };
    slotEls[i].classList.add('dragging');
    moveDrag(e.clientX, e.clientY);
  }
  function moveDrag(px, py) {
    const d = drag, left = px - d.w / 2, top = py - d.lift;
    d.ghost.style.transform = `translate(${left}px, ${top}px)`;
    const c = Math.round((left - d.g.x) / d.g.pitch), r = Math.round((top - d.g.y) / d.g.pitch);
    if (canPlace(tray[d.slot].shape, r, c)) {
      if (r !== d.r || c !== d.c) { d.r = r; d.c = c; setPreview(d.slot, r, c); render(); }
    } else if (d.r !== null) { d.r = d.c = null; preview = null; render(); }
  }
  function endDrag(drop) {
    const d = drag;
    if (!d) return;
    drag = null;
    d.ghost.remove();
    slotEls[d.slot].classList.remove('dragging');
    preview = null;
    if (!(drop && d.r !== null && place(d.slot, d.r, d.c))) render();
  }

  slotEls.forEach((el, i) => {
    el.addEventListener('pointerdown', e => {
      if (over || !tray[i] || drag || e.button > 0) return;
      e.preventDefault();
      startDrag(i, e);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kbSelect(i); }
    });
  });
  window.addEventListener('pointermove', e => {
    if (drag && e.pointerId === drag.id) { e.preventDefault(); moveDrag(e.clientX, e.clientY); }
  }, { passive: false });
  window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) endDrag(true); });
  window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(false); });
  window.addEventListener('blur', () => endDrag(false));
  window.addEventListener('resize', () => { if (!drag) renderTray(); });

  // Tastatur: Teil wählen (1-3 oder Enter), Pfeiltasten bewegen, Enter setzt, Esc bricht ab
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function kbSelect(i) {
    if (over || !tray[i] || drag) return;
    cancelKb();
    const p = tray[i];
    kb = { slot: i, r: Math.floor((N - p.shape.h) / 2), c: Math.floor((N - p.shape.w) / 2) };
    slotEls[i].classList.add('selected');
    setPreview(i, kb.r, kb.c); render();
    boardEl.focus();
    announce(`Teil ${i + 1} gewählt. Pfeiltasten bewegen, Enter setzt, Escape bricht ab.`);
  }
  function cancelKb() {
    if (!kb) return;
    slotEls[kb.slot].classList.remove('selected');
    kb = null; preview = null; render();
  }
  boardEl.addEventListener('keydown', e => {
    if (!kb) return;
    const p = tray[kb.slot];
    const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (moves[e.key]) {
      e.preventDefault();
      kb.r = clamp(kb.r + moves[e.key][0], 0, N - p.shape.h);
      kb.c = clamp(kb.c + moves[e.key][1], 0, N - p.shape.w);
      setPreview(kb.slot, kb.r, kb.c); render();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const { slot, r, c } = kb;
      if (canPlace(p.shape, r, c)) {
        slotEls[slot].classList.remove('selected');
        kb = null; preview = null;
        place(slot, r, c);
        const next = slotEls.find((el, j) => tray[j]);
        if (next && !over) next.focus();
      } else {
        tone(120, 0.1, 'square', 0.04);
        announce('Passt hier nicht.');
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      const s = kb.slot;
      cancelKb();
      slotEls[s].focus();
    }
  });
  boardEl.addEventListener('blur', () => { setTimeout(() => { if (kb && document.activeElement !== boardEl) cancelKb(); }, 0); });
  document.addEventListener('keydown', e => {
    if (!overEl.hidden) return;
    if (e.key === '1' || e.key === '2' || e.key === '3') kbSelect(+e.key - 1);
  });

  // Buttons
  $('restartBtn').addEventListener('click', newGame);
  $('again').addEventListener('click', newGame);
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    store.set('blockspiel-sound', soundOn ? '1' : '0');
    updateSoundBtn();
    tone(440, 0.08);
  });

  updateSoundBtn();
  newGame();
})();
</script>
</body>
</html>
